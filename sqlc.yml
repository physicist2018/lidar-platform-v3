version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/identity/*.sql"
    queries: "queries/identity"
    gen:
      go:
        package: "identity"
        out: "pkg/db/identity"
        emit_json_tags: true
        emit_prepared_queries: false
  - engine: "postgresql"
    schema: "migrations/lidar/*.sql"
    queries: "queries/lidar"
    gen:
      go:
        package: "lidar"
        out: "pkg/db/lidar"
        emit_json_tags: true
        emit_prepared_queries: false
