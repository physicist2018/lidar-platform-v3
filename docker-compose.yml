services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: main_db  # общая база
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Сюда можно положить entrypoint-скрипт, который создаёт схемы и пользователей
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  identity:
    build:
      context: .
      dockerfile: cmd/identity/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://identity_user:pass@postgres:5432/main_db?search_path=identity&sslmode=disable
      HTTP_ADDR: :8080
      JWT_SECRET: change-me-in-production
      SMTP_SERVER: smtp.yandex.ru:465
      SMTP_USERNAME: physicist2018@yandex.ru
      SMTP_PASSWORD: arsyetydmdertfey
      SMTP_FROM: physicist2018@yandex.ru
      VERIFY_BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8090
    depends_on:
      - postgres

  lidar:
    build: ./cmd/lidar
    environment:
      DATABASE_URL: postgresql://lidar_user:pass@postgres:5432/main_db?search_path=public&sslmode=disable
    depends_on:
      - postgres

volumes:
  pgdata:
