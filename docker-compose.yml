services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: main_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d main_db"]
      interval: 1s
      retries: 15
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  nats:
    image: nats:latest
    command: -js -sd /data
    ports:
      - "4222:4222"
    volumes:
      - nats_data:/data

  identity:
    build:
      context: .
      dockerfile: cmd/identity/Dockerfile
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://identity_user:pass@postgres:5432/main_db?search_path=identity&sslmode=disable
      HTTP_ADDR: :8090
      JWT_SECRET: change-me-in-production
      MIGRATIONS_DIR: /migrations/identity
      SMTP_SERVER: smtp.mail.ru:587
      SMTP_USERNAME: lidar-processing@inbox.ru
      SMTP_PASSWORD: ulhEEMqGkJmhPXPF0mej
      SMTP_FROM: lidar-processing@inbox.ru
      VERIFY_BASE_URL: http://localhost:8090
      FRONTEND_URL: http://localhost:8090
    depends_on:
      postgres:
        condition: service_healthy

  lidar:
    build:
      context: .
      dockerfile: cmd/lidar/Dockerfile
    ports:
      - "8091:8091"
    environment:
      DATABASE_URL: postgresql://lidar_user:pass@postgres:5432/main_db?search_path=lidar&sslmode=disable
      DATABASE_URL_MIGRATIONS: postgresql://user:pass@postgres:5432/main_db?sslmode=disable
      HTTP_ADDR: :8091
      MIGRATIONS_DIR: /migrations/lidar
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_started

volumes:
  pgdata:
  minio_data:
  nats_data:
