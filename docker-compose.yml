services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: main_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d main_db"]
      interval: 1s
      retries: 15
      start_period: 5s

  identity:
    build:
      context: .
      dockerfile: cmd/identity/Dockerfile
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://identity_user:pass@postgres:5432/main_db?search_path=identity&sslmode=disable
      HTTP_ADDR: :8090
      JWT_SECRET: change-me-in-production
      MIGRATIONS_DIR: /migrations/identity
      SMTP_SERVER: smtp.yandex.ru:465
      SMTP_USERNAME: physicist2018@yandex.ru
      SMTP_PASSWORD: arsyetydmdertfey
      SMTP_FROM: physicist2018@yandex.ru
      VERIFY_BASE_URL: http://localhost:8090
      FRONTEND_URL: http://localhost:8090
    depends_on:
      postgres:
        condition: service_healthy

  lidar:
    build: ./cmd/lidar
    environment:
      DATABASE_URL: postgresql://lidar_user:pass@postgres:5432/main_db?search_path=public&sslmode=disable
    depends_on:
      - postgres

volumes:
  pgdata:
