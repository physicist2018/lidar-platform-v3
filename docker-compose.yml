services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: main_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d main_db"]
      interval: 1s
      retries: 15
      start_period: 5s
    networks:
      - backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: https://localhost/minio-console/
    volumes:
      - minio_data:/data
    networks:
      - frontend
      - backend

  nats:
    image: nats:alpine
    command: -js -sd /data
    volumes:
      - nats_data:/data
    networks:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - identity
      - lidar
      - minio
    networks:
      - frontend

  identity:
    build:
      context: .
      dockerfile: cmd/identity/Dockerfile
    environment:
      DATABASE_URL: postgresql://identity_user:pass@postgres:5432/main_db?search_path=identity&sslmode=disable
      HTTP_ADDR: :8090
      JWT_SECRET: change-me-in-production
      MIGRATIONS_DIR: /migrations/identity
      SMTP_SERVER: smtp.mail.ru:587
      SMTP_USERNAME: lidar-processing@inbox.ru
      SMTP_PASSWORD: ulhEEMqGkJmhPXPF0mej
      SMTP_FROM: lidar-processing@inbox.ru
      VERIFY_BASE_URL: https://localhost
      FRONTEND_URL: https://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend

  lidar:
    build:
      context: .
      dockerfile: cmd/lidar/Dockerfile
    environment:
      DATABASE_URL: postgresql://lidar_user:pass@postgres:5432/main_db?search_path=lidar,public&sslmode=disable
      HTTP_ADDR: :8091
      MIGRATIONS_DIR: /migrations/lidar
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      NATS_URL: nats://nats:4222
      JWT_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - frontend
      - backend

  worker:
    build:
      context: .
      dockerfile: cmd/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://lidar_user:pass@postgres:5432/main_db?search_path=lidar,public&sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      nats:
        condition: service_started
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  pgdata:
  minio_data:
  nats_data:
